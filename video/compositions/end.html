// Plays one of the app's real character loops (captured frame by frame from
// the React Native components) on a sprite element, at the app's own speed.
function sprite(tl, sel, key, start, dur, size) {
  const m = SPR[key], el = document.querySelector(sel), o = { f: 0 };
  el.style.backgroundImage = "url('assets/sprites/" + key + ".webp')";
  el.style.backgroundSize = (m.cols * size) + 'px ' + (m.rows * size) + 'px';
  el.style.width = size + 'px'; el.style.height = size + 'px';
  const paint = () => { const i = Math.floor(o.f) % m.frames;
    el.style.backgroundPosition = (-(i % m.cols) * size) + 'px ' + (-Math.floor(i / m.cols) * size) + 'px'; };
  paint();
  tl.fromTo(o, { f: 0 }, { f: dur * m.fps, duration: dur, ease: 'none', onUpdate: paint }, start);
}
// Word-by-word blur-in for a title (no translate).
function words(tl, sel, at, gap) {
  document.querySelectorAll(sel + ' .word').forEach((w, i) => {
    tl.fromTo(w, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.16, ease: 'power4.out' }, at + i * (gap || 0.07));
  });
}
function wordsOut(tl, sel, at) {
  tl.to(sel, { opacity: 0, filter: 'blur(8px)', duration: 0.2, ease: 'power3.in' }, at);
}
// Typewriter: reveal text one character at a time, deterministic on seek.
function typer(tl, sel, text, start, dur) {
  const el = document.querySelector(sel), o = { n: 0 };
  const paint = () => { el.textContent = text.slice(0, Math.round(o.n)); };
  paint();
  tl.fromTo(o, { n: 0 }, { n: text.length, duration: dur, ease: 'none', onUpdate: paint }, start);
}
// Rolling counter.
function counter(tl, sel, from, to, start, dur, suffix) {
  const el = document.querySelector(sel), o = { v: from };
  const paint = () => { const v = Math.round(o.v); el.textContent = (to >= 99 && v >= 99 ? '99+' : v) + (suffix || ''); };
  paint();
  tl.fromTo(o, { v: from }, { v: to, duration: dur, ease: 'power1.in', onUpdate: paint }, start);
}
