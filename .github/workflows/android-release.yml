name: Android APK release

# Every push to main (or a v* tag, or a manual run) builds an APK and attaches it to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  # Pull requests build the same APK as a downloadable artifact (no release), so size and
  # behaviour can be checked before merging.
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Both values are public by design (Supabase RLS protects the data).
      EXPO_PUBLIC_SUPABASE_URL: https://yepkpeidgmwjsfggnhbw.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_BQ-ey5WMoIoypR-bhc7RWQ_K6feCRVc
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
      # app.config.js turns RELEASE_TAG into versionName/versionCode. "github" keeps the in-app
      # updater; a Google Play build would use SELAH_CHANNEL=play.
      SELAH_CHANNEL: github
      # SHA-256 of the certificate every Selah APK has been signed with so far. Android only
      # installs an update over the old app when this stays the same, so the build fails loudly
      # if it ever changes by accident.
      EXPECTED_CERT_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set).

      - name: Install dependencies
        run: npm ci

      - name: Checks
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Selah-${RELEASE_TAG}.apk"

      - name: Check signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "Selah-${RELEASE_TAG}.apk" | tee certs.txt
          grep -qi "certificate SHA-256 digest: ${EXPECTED_CERT_SHA256}" certs.txt || {
            echo "::error::APK signing certificate changed. Installed apps will refuse this update."; exit 1; }

      - name: APK size
        run: |
          ls -l "Selah-${RELEASE_TAG}.apk"
          echo "### APK: $(du -h "Selah-${RELEASE_TAG}.apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          unzip -lv "Selah-${RELEASE_TAG}.apk" | sort -k3 -n -r | head -25 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Selah-pr-${{ github.event.number }}-apk
          path: Selah-${{ env.RELEASE_TAG }}.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Selah ${{ env.RELEASE_TAG }}
          files: Selah-${{ env.RELEASE_TAG }}.apk
          body: |
            ## Cara pasang
            1. Unduh **Selah-${{ env.RELEASE_TAG }}.apk** di bawah (dari HP Android).
            2. Buka file-nya. Jika diminta, izinkan "Instal aplikasi tidak dikenal" untuk browser/File Manager.
            3. Buka Selah, lalu masuk dengan Google.

            Sudah punya Selah? Cukup pasang di atasnya: versi lama diganti dan datamu tetap ada.
            Mulai versi ini, pembaruan berikutnya muncul sendiri di **Pengaturan** dan bisa dipasang dari aplikasi.
